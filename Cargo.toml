[package]
name = "riproxy-gui"
version = "0.1.1"
edition = "2024"

[features]
default = ["backend-leaf", "backend-rog"]
backend-leaf = ["dep:leaf"]
backend-rog = ["dep:rog"]

[dependencies]
anyhow = "1.0"
auto-launch = "0.6"
directories = "6.0"
eframe = "0.35"
egui_extras = "0.35"
proxy-observe = { package = "riproxy-observe", version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
tray-icon = "0.24"

leaf = { git = "https://github.com/rikaaa0928/leaf.git", branch = "main", default-features = false, features = [
    "rog-default-aws-lc",
    "lifecycle-hooks",
    "auto-reload",
], optional = true }
rog = { git = "https://github.com/rikaaa0928/rog.git", branch = "main", optional = true }

[target.'cfg(not(windows))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
