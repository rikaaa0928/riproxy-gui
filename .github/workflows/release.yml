name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.backend.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        backend:
          - name: leaf-rog
            features: backend-leaf,backend-rog
          - name: leaf-only
            features: backend-leaf
          - name: rog-only
            features: backend-rog
        include:
          - os: ubuntu-latest
            platform: linux-gnu
            binary: riproxy-gui
          - os: macos-latest
            platform: macos
            binary: riproxy-gui
          - os: windows-latest
            platform: windows-msvc
            binary: riproxy-gui.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --no-default-features --features ${{ matrix.backend.features }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="riproxy-gui-${version}-${{ matrix.platform }}-${{ matrix.backend.name }}"
          mkdir -p "dist/${name}"
          cp "target/release/${{ matrix.binary }}" "dist/${name}/"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $name = "riproxy-gui-$version-${{ matrix.platform }}-${{ matrix.backend.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/$name/"
          if (Test-Path README.md) { Copy-Item README.md "dist/$name/" }
          Get-ChildItem -Path . -Filter "LICENSE*" | ForEach-Object { Copy-Item $_.FullName "dist/$name/" }
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riproxy-gui-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.backend.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
